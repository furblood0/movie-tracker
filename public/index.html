<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Izlediginiz film ve dizileri puanlayin, notlarinizi tutun." />
    <meta name="color-scheme" content="dark" />
    <title>Movie Tracker &mdash; Film &amp; Dizi Gunlugu</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <!--
      Uygulama kabugu. Icerik tamamen Vanilla JS ile (ES modules) uretilir;
      goruntuler #view icine takilir. Boylece sayfa yenilenmeden gecis yapilir.
    -->
    <a class="skip-link" href="#view">Icerige gec</a>

    <header class="app-bar" id="app-bar" hidden>
      <div class="app-bar__inner">
        <a class="brand" href="/" data-nav="library" aria-label="Movie Tracker ana sayfa">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
            <path
              d="M16 4l3.4 7.2 7.8 1.1-5.7 5.5 1.4 7.8L16 21.9 9.1 25.6l1.4-7.8-5.7-5.5 7.8-1.1z"
            />
          </svg>
          <span class="brand__text">Movie<strong>Tracker</strong></span>
        </a>

        <nav class="app-nav" aria-label="Ana gezinme">
          <button type="button" class="app-nav__link is-active" data-nav="library">Gunlugum</button>
          <button type="button" class="app-nav__link" data-nav="discover">Kesfet</button>
        </nav>

        <div class="app-bar__spacer"></div>

        <div class="user-menu" id="user-menu"></div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <!-- Bildirimler (toast) ve modal katmani -->
    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
    <div class="modal-root" id="modal-root"></div>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
